<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">End Platform Preserver</title>
  <desc id="desc">Keep your corner of the End. A pixel-inspired obsidian arrival platform with a chest and green plants floats beneath a purple End sky.</desc>
  <defs>
    <linearGradient id="sky" x2="1" y2="1">
      <stop stop-color="#161323"/>
      <stop offset=".6" stop-color="#272039"/>
      <stop offset="1" stop-color="#39304c"/>
    </linearGradient>
    <linearGradient id="land" x2="0" y2="1">
      <stop stop-color="#d8dfac"/>
      <stop offset="1" stop-color="#9baf80"/>
    </linearGradient>
    <pattern id="obsidian" width="36" height="24" patternUnits="userSpaceOnUse">
      <rect width="36" height="24" fill="#342944"/>
      <path d="M0 0H36V24H0Z" fill="none" stroke="#181723" stroke-width="2"/>
      <path d="M4 5H17V9H4ZM23 15H32V20H23Z" fill="#574367"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" rx="20" fill="url(#sky)"/>
  <g fill="#b8a0d7" opacity=".5">
    <path d="M60 52h4v4h-4zM284 40h3v3h-3zM547 66h4v4h-4zM713 39h3v3h-3zM1174 58h4v4h-4zM1228 219h3v3h-3zM648 324h3v3h-3zM734 232h4v4h-4zM1117 340h4v4h-4zM487 351h3v3h-3z"/>
