    <path d="M783 102V84h12v18zM1154 120V104h12v16z"/>
  </g>
  <rect x="64" y="65" width="199" height="28" rx="4" fill="#d1dfab"/>
  <text x="78" y="84" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#242b25">A SMALL FABRIC MOD</text>
  <g font-family="Segoe UI,Arial,sans-serif" fill="#f7f3fc" font-weight="800" font-size="55" letter-spacing="-1.5">
    <text x="61" y="165">KEEP YOUR CORNER</text>
    <text x="61" y="227">OF THE <tspan fill="#d0b3ef">END.</tspan></text>
  </g>
  <text x="65" y="274" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#c4bacf">Your builds stay. The obsidian floor regenerates.</text>
  <path d="M65 314h38" stroke="#c5dba3" stroke-width="4"/>
  <text x="116" y="319" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="#c5dba3">END PLATFORM PRESERVER</text>
  <g stroke-linejoin="round">
